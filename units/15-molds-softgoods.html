<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>單元 15 · 模具注塑同軟綿交接</title>
<link rel="stylesheet" href="../assets/course.css" />
<style>
.pad.on rect, .pad.on circle { fill: rgba(255,209,102,.45) !important; }
.hit.on { outline: 2px solid var(--accent); }

.mold { width:min(100%,500px); margin:0 auto; }
.mold svg { width:100%; height:auto; }
.mp { cursor:pointer; }
.mp:hover, .mp.on { filter:brightness(1.25); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topnav">
    <a class="btn ghost" href="../index.html">← 課程目錄</a>
    <span class="badge">單元 15 · 其他</span>
  </div>
  <h1>模具注塑同軟綿交接</h1>
  <p class="lead">硬膠件（頭殼、關節、電池倉、齒輪箱）點樣「長」入毛絨——倒扣、布夾、螺柱、包膠，決定外觀同拉力。</p>

    <div class="hero-stage">
    <div class="stage3d">
      <h3 style="margin-top:0;">模具開合同夾布法蘭（拖開模）</h3>
      <p class="hero-caption">拖「開模距離」：睇分型線同夾布槽——硬膠進毛絨嘅交接面。</p>
      <div class="hero-widget">
        <svg viewBox="0 0 640 300" role="img" aria-label="模具">
          <rect x="8" y="8" width="624" height="284" rx="16" fill="#121925"/>
          <rect id="moldA" x="120" y="80" width="160" height="140" rx="8" fill="#3a4558" stroke="#9aa8bc"/>
          <rect id="moldB" x="360" y="80" width="160" height="140" rx="8" fill="#2a3344" stroke="#9aa8bc"/>
          <rect id="flange" x="270" y="120" width="100" height="60" rx="4" fill="rgba(255,143,171,.35)" stroke="#ff8fab"/>
          <text x="320" y="250" text-anchor="middle" fill="#ffd0dc" font-size="12">夾布法蘭</text>
          <text id="moldGap" x="320" y="275" text-anchor="middle" fill="#e8eef7" font-size="14" font-weight="700">開模 40mm</text>
        </svg>
        <div class="hero-controls">
          <label>開模距離 <input type="range" id="moldOpen" min="0" max="80" value="40"></label>
        </div>
      </div>
      <div class="panel" id="moldPanel"><strong>模具互動</strong>：分型線同法蘭寬度要同車縫拉力匹配。</div>
    </div>
  </div>


  <h2>模具要注意</h2>
  <div class="timeline" id="moldTips"></div>

  <h2>失效</h2>
  <div class="timeline" id="fails"></div>

  <div class="exercise">
    <h3>單元練習</h3>
    <p>硬膠進毛絨，邊啲<strong>必須</strong> lock？</p>
    <div class="checklist" id="quiz"></div>
    <div class="progress"><span id="bar"></span></div>
    <p class="note" id="scoreNote"></p>
    <button class="btn" type="button" id="markDone">完成本單元</button>
    <p class="note" id="saveMsg"></p>
  </div>

  <div class="footer-nav">
    <a class="btn ghost" href="14-safety-regs.html">← 單元 14</a>
    <a class="btn ghost" href="16-sample-stages.html">單元 16 →</a>
  </div>
</div>
<script>
const info={
  shell:'<strong>硬膠件<\/strong>：材料（ABS/PC/POM）、表面（晒紋／亮面）、縮水。外觀面同藏布面要分清。',
  flange:'<strong>夾布法蘭<\/strong>：布夾入膠件槽再車或熱壓。寬度要夠拉力；毛向同厚度要試。',
  sew:'<strong>車縫固定<\/strong>：針距、距離邊緣、加固。開孔位要預留，唔好車崩膠。',
  boss:'<strong>螺柱<\/strong>：壁厚、牙型、扭矩。過緊崩柱；過鬆晃動。',
  undercut:'<strong>倒扣<\/strong>：裝配快但模具要滑塊／強制頂出——成本升。評：產量 vs 模費。',
};
document.querySelectorAll('.mp').forEach(p=>{
  p.addEventListener('click',()=>{
    document.querySelectorAll('.mp').forEach(x=>x.classList.remove('on'));
    p.classList.add('on');
    document.getElementById('moldPanel').innerHTML=info[p.dataset.id];
  });
});
const tips=[
  {t:'分模線',d:'避開外觀同夾布面；飛邊會割布同割傷手。'},
  {t:'拔模斜度',d:'深腔要斜度，否則拉傷、頂白。'},
  {t:'壁厚均勻',d:'縮水凹痕影響裝配。'},
  {t:'嵌件',d:'銅牙、磁鐵嵌件定位同包膠工藝。'},
];
tips.forEach((a,i)=>{
  const el=document.createElement('div'); el.className='step';
  el.innerHTML=`<div class="num">${i+1}<\/div><div><h4>${a.t}<\/h4><div class="detail" style="display:block">${a.d}<\/div><\/div>`;
  document.getElementById('moldTips').appendChild(el);
});
const fails=[
  {t:'夾布脫落',d:'法蘭太窄／車縫太外邊。拉力測試失敗。'},
  {t:'露膠一圈',d:'外觀不良；要加深藏布或改顏色。'},
  {t:'螺柱滑牙',d:'大貨扭矩槍設定同抽檢。'},
  {t:'模費爆炸',d:'倒扣過多。簡化裝配結構。'},
];
fails.forEach((a,i)=>{
  const el=document.createElement('div'); el.className='step';
  el.innerHTML=`<div class="num">${i+1}<\/div><div><h4>${a.t}<\/h4><div class="detail" style="display:block">${a.d}<\/div><\/div>`;
  document.getElementById('fails').appendChild(el);
});
const quizItems=[
  {q:'夾布／固位方式同拉力目標', ok:true},
  {q:'分模線同外觀面定義', ok:true},
  {q:'週末球賽比分預測', ok:false},
  {q:'螺柱規格同扭矩', ok:true},
  {q:'辦公室溫度設定', ok:false},
];
const quiz=document.getElementById('quiz');
quizItems.forEach((item,i)=>{
  const lab=document.createElement('label');
  lab.innerHTML=`<input type="checkbox" id="q${i}"> <span>${item.q}<\/span>`;
  quiz.appendChild(lab);
  lab.querySelector('input').addEventListener('change',score);
});
function score(){
  let m=0; quizItems.forEach((it,i)=>{if(document.getElementById('q'+i).checked===it.ok)m++;});
  const pct=Math.round(m/quizItems.length*100);
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('scoreNote').textContent='吻合度 '+pct+'%（應勾：夾布拉力、分模線、螺柱扭矩）';
}
score();
document.getElementById('markDone').onclick=()=>{
  const done=JSON.parse(localStorage.getItem('toyCourseDone')||'{}');
  done['15']=true; localStorage.setItem('toyCourseDone',JSON.stringify(done));
  document.getElementById('saveMsg').textContent='已儲存：單元 15 完成。';
};


(function(){
  const a=document.getElementById('moldA');
  const b=document.getElementById('moldB');
  const gap=document.getElementById('moldGap');
  const panel=document.getElementById('moldPanel');
  function render(){
    const o=+document.getElementById('moldOpen').value;
    if(a) a.setAttribute('x', String(200-o));
    if(b) b.setAttribute('x', String(280+o));
    if(gap) gap.textContent=`開模 ${o*2}mm`;
    if(panel) panel.innerHTML=o<15?'<strong>合模<\/strong>：注意分型線披鋒會割布。':'<strong>開模<\/strong>：夾布法蘭要露出足夠車縫位。';
  }
  document.getElementById('moldOpen')?.addEventListener('input', render); render();
})();

</script>
</body>
</html>
