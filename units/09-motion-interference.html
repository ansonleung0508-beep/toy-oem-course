<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>單元 09 · 動作行程同軟綿干涉</title>
<link rel="stylesheet" href="../assets/course.css" />
<style>
.pad.on rect, .pad.on circle { fill: rgba(255,209,102,.45) !important; }
.hit.on { outline: 2px solid var(--accent); }

.motion { width:min(100%,500px); margin:0 auto; }
.motion svg { width:100%; height:auto; }
#armMove { transform-origin: 150px 160px; }
.moving #armMove { animation: raise 1.8s ease-in-out infinite; }
@keyframes raise { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-55deg)} }
.warn-zone { fill:rgba(255,123,114,.25); stroke:#ff7b72; stroke-width:2; stroke-dasharray:4 3; }
.ok-zone { fill:rgba(125,222,162,.2); stroke:#7ddea2; stroke-width:2; }
.ctrl button { padding:8px 14px; border-radius:10px; background:var(--card2); border:1px solid rgba(255,255,255,.08); color:var(--text); cursor:pointer; font-weight:600; margin:4px; }
.ctrl button.on { border-color:var(--mech); background:rgba(125,222,162,.2); }
.issue { cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topnav">
    <a class="btn ghost" href="../index.html">← 課程目錄</a>
    <span class="badge">單元 09 · 機械</span>
  </div>
  <h1>動作行程同軟綿干涉</h1>
  <p class="lead">機構「得」，整機未必得——舉手扯爛腋下縫、擺頭扯甩眼珠，都係干涉問題。三線一齊做行程檢查。</p>

    <div class="hero-stage">
    <div class="stage3d">
      <h3 style="margin-top:0;">舉手行程 vs 軟綿干涉（拖角度）</h3>
      <p class="hero-caption">拖手臂角度：撞到腋下縫／布面會標紅——動作位要同打版一齊改。</p>
      <div class="hero-widget">
        <svg viewBox="0 0 640 320" role="img" aria-label="動作干涉">
          <rect x="8" y="8" width="624" height="304" rx="16" fill="#121925"/>
          <ellipse cx="280" cy="200" rx="100" ry="80" fill="#e8799b" opacity=".45"/>
          <circle cx="280" cy="110" r="50" fill="#e8799b" opacity=".55"/>
          <path id="seamHot" d="M200 160 Q240 140 260 180" fill="none" stroke="#ff7b72" stroke-width="0" stroke-linecap="round"/>
          <g id="armGroup" transform="rotate(20 260 170)">
            <rect x="250" y="170" width="28" height="110" rx="12" fill="#7ddea2"/>
          </g>
          <text id="collides" x="480" y="150" text-anchor="middle" fill="#3dd68c" font-size="14" font-weight="700">間隙 OK</text>
          <text id="armDeg" x="320" y="290" text-anchor="middle" fill="#9aa8bc" font-size="13">手臂角 20°</text>
        </svg>
        <div class="hero-controls">
          <label>舉手角度 <input type="range" id="armLift" min="0" max="90" value="20"></label>
        </div>
      </div>
      <div class="panel" id="motPanel"><strong>干涉互動</strong>：標紅＝要減行程、加加固或改袖型。</div>
    </div>
  </div>


  <h2>檢查流程</h2>
  <div class="timeline" id="flow"></div>

  <h2>典型失效同交接</h2>
  <div class="timeline" id="fail"></div>

  <div class="exercise">
    <h3>單元練習</h3>
    <p>動作干涉檢查，邊啲<strong>一定</strong>要做？</p>
    <div class="checklist" id="quiz"></div>
    <div class="progress"><span id="bar"></span></div>
    <p class="note" id="scoreNote"></p>
    <button class="btn" type="button" id="markDone">完成本單元</button>
    <p class="note" id="saveMsg"></p>
  </div>

  <div class="footer-nav">
    <a class="btn ghost" href="08-gears-cams-springs.html">← 單元 08</a>
    <a class="btn ghost" href="10-plush-materials.html">單元 10 →</a>
  </div>
</div>
<script>
const info={
  seam:'<strong>腋下縫<\/strong>：舉手拉應力集中。對策：加大縫份、加固條、減行程、改關節位置。',
  arm:'<strong>手臂<\/strong>：布筒太窄＝卡；太鬆＝露骨架。袖型同行程一齊打版。',
  eye:'<strong>五官<\/strong>：擺頭／扯布令眼鼻鬆脫。對策：五官背扣加固、頭內骨架分力。',
  bunch:'<strong>填充堆積<\/strong>：動作位棉團卡住機構。對策：局部少填、隔布袋、定型棉。',
};
document.querySelectorAll('.issue').forEach(el=>{
  el.addEventListener('click',()=>{
    document.getElementById('motPanel').innerHTML=info[el.dataset.id];
  });
});
const svg=document.getElementById('motSvg');
const _go=document.getElementById('go'); if(_go) _go.onclick=()=>{ svg && svg.classList.add('moving'); document.getElementById('go').classList.add('on'); document.getElementById('stop').classList.remove('on'); };
const _st=document.getElementById('stop'); if(_st) _st.onclick=()=>{ svg && svg.classList.remove('moving'); document.getElementById('stop').classList.add('on'); document.getElementById('go').classList.remove('on'); };

const flow=[
  {t:'1. 裸機構行程',d:'無布狀態量角度、力矩、限位。'},
  {t:'2. 內膽試裝',d:'薄布內膽＋骨架，睇扯縫同皺褶。'},
  {t:'3. 大貨布＋填充',d:'完整手感下再測；填充量要標稱±公差。'},
  {t:'4. 壽命循環',d:'動作 N 次後查縫口、五官、電流、噪音。'},
];
flow.forEach((a,i)=>{
  const el=document.createElement('div'); el.className='step';
  el.innerHTML=`<div class="num">${i+1}<\/div><div><h4>${a.t}<\/h4><div class="detail" style="display:block">${a.d}<\/div><\/div>`;
  document.getElementById('flow').appendChild(el);
});
const fail=[
  {t:'縫口裂',d:'交接：機構減行程 ↔ 車縫加固 ↔ 面料延展。'},
  {t:'露骨／起角',d:'交接：骨架倒角 ↔ 填充 ↔ 布筒版型。'},
  {t:'動作變慢',d:'棉阻／潤滑乾 → 電流升。交接：電子限流閾值要按整機。'},
  {t:'五官脫',d:'交接：頭殼固位 ↔ 車縫拉力 ↔ 安規細件。'},
];
fail.forEach((a,i)=>{
  const el=document.createElement('div'); el.className='step';
  el.innerHTML=`<div class="num">${i+1}<\/div><div><h4>${a.t}<\/h4><div class="detail" style="display:block">${a.d}<\/div><\/div>`;
  document.getElementById('fail').appendChild(el);
});
const quizItems=[
  {q:'裸機構＋整機兩階段行程驗證', ok:true},
  {q:'腋下／頸位縫口加固方案', ok:true},
  {q:'公司年會場地選址', ok:false},
  {q:'填充在動作位的避位／定型', ok:true},
  {q:'股票代碼設計', ok:false},
];
const quiz=document.getElementById('quiz');
quizItems.forEach((item,i)=>{
  const lab=document.createElement('label');
  lab.innerHTML=`<input type="checkbox" id="q${i}"> <span>${item.q}<\/span>`;
  quiz.appendChild(lab);
  lab.querySelector('input').addEventListener('change',score);
});
function score(){
  let m=0; quizItems.forEach((it,i)=>{if(document.getElementById('q'+i).checked===it.ok)m++;});
  const pct=Math.round(m/quizItems.length*100);
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('scoreNote').textContent='吻合度 '+pct+'%（應勾：兩階段行程、縫口加固、填充避位）';
}
score();
document.getElementById('markDone').onclick=()=>{
  const done=JSON.parse(localStorage.getItem('toyCourseDone')||'{}');
  done['09']=true; localStorage.setItem('toyCourseDone',JSON.stringify(done));
  document.getElementById('saveMsg').textContent='已儲存：單元 09 完成。';
};


(function(){
  const arm=document.getElementById('armGroup');
  const seam=document.getElementById('seamHot');
  const col=document.getElementById('collides');
  const deg=document.getElementById('armDeg');
  const panel=document.getElementById('motPanel');
  function render(){
    const a=+document.getElementById('armLift').value;
    if(arm) arm.setAttribute('transform', `rotate(${a} 260 170)`);
    const hit=a>=55;
    if(seam) seam.setAttribute('stroke-width', hit?'10':'0');
    if(col){ col.textContent=hit?'⚠ 干涉／拉縫':'間隙 OK'; col.setAttribute('fill', hit?'#ff7b72':'#3dd68c'); }
    if(deg) deg.textContent=`手臂角 ${a}°`;
    if(panel) panel.innerHTML=hit?'<strong>干涉<\/strong>：腋下縫受力——減行程或加加固條。':'<strong>OK<\/strong>：動作同布筒淨空足夠。';
  }
  document.getElementById('armLift')?.addEventListener('input', render); render();
})();

</script>
</body>
</html>
