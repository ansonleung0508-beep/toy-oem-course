<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>單元 12 · 公仔衫同服飾</title>
<link rel="stylesheet" href="../assets/course.css" />
<style>
.pad.on rect, .pad.on circle { fill: rgba(255,209,102,.45) !important; }
.hit.on { outline: 2px solid var(--accent); }

.doll { width:min(100%,420px); margin:0 auto; }
.doll svg { width:100%; height:auto; }
.cpart { cursor:pointer; transition:.2s; }
.cpart:hover, .cpart.on { filter:brightness(1.2); }
.pat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
.pat-grid .card { cursor:pointer; }
.pat-grid .card.active { border-color:var(--soft); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topnav">
    <a class="btn ghost" href="../index.html">← 課程目錄</a>
    <span class="badge">單元 12 · 毛絨</span>
  </div>
  <h1>公仔衫同服飾</h1>
  <p class="lead">Fashion doll／着衫公仔：樣版、面料、車縫、脫穿便利同安規細件（紐扣、拉鍊）一齊管。</p>

    <div class="hero-stage">
    <div class="stage3d">
      <h3 style="margin-top:0;">公仔衫紙樣同扣件（撳裁片）</h3>
      <p class="hero-caption">撳紙樣裁片同扣件：睇行程活動位同細件安規——衫唔可以擋開關／IR。</p>
      <div class="hero-widget">
        <svg viewBox="0 0 640 300" role="img" aria-label="紙樣">
          <rect x="8" y="8" width="624" height="284" rx="16" fill="#121925"/>
          <g class="cpart hit" data-id="dress">
            <path d="M260 70 L320 50 L380 70 L400 200 L240 200 Z" fill="rgba(91,140,255,.25)" stroke="#5b8cff" stroke-width="2"/>
            <text x="320" y="140" text-anchor="middle" class="zone-label" style="fill:#c7d8ff">衫／裙</text>
          </g>
          <g class="cpart hit" data-id="sleeve">
            <path d="M180 90 L240 110 L230 180 L160 160 Z" fill="rgba(125,222,162,.25)" stroke="#7ddea2" stroke-width="2"/>
            <text x="200" y="140" text-anchor="middle" fill="#c9f5db" font-size="11" font-weight="700">袖</text>
          </g>
          <g class="cpart hit" data-id="fast">
            <circle cx="320" cy="170" r="14" fill="#ffd166"/><text x="320" y="210" text-anchor="middle" fill="#ffe9b0" font-size="11">扣件</text>
          </g>
          <g class="cpart hit" data-id="shoes">
            <ellipse cx="280" cy="250" rx="28" ry="14" fill="#a67c52"/><ellipse cx="360" cy="250" rx="28" ry="14" fill="#a67c52"/>
            <text x="320" y="275" text-anchor="middle" fill="#e8c9a8" font-size="11">鞋</text>
          </g>
          <g class="cpart hit" data-id="hair">
            <path d="M300 40 Q320 10 340 40" fill="none" stroke="#ff8fab" stroke-width="8" stroke-linecap="round"/>
            <text x="400" y="40" fill="#ffd0dc" font-size="11">頭髮</text>
          </g>
        </svg>
      </div>
      <div class="panel" id="dollPanel"><strong>服飾互動</strong>：撳裁片睇同機構／電子嘅交接。</div>
    </div>
  </div>


  <h2>樣版重點（撳卡）</h2>
  <div class="pat-grid" id="pats"></div>
  <div class="panel" id="patPanel">揀一項。</div>

  <h2>同電子機構交接</h2>
  <div class="timeline" id="ho"></div>

  <div class="exercise">
    <h3>單元練習</h3>
    <p>公仔衫開發，邊啲<strong>必須</strong>確認？</p>
    <div class="checklist" id="quiz"></div>
    <div class="progress"><span id="bar"></span></div>
    <p class="note" id="scoreNote"></p>
    <button class="btn" type="button" id="markDone">完成本單元</button>
    <p class="note" id="saveMsg"></p>
  </div>

  <div class="footer-nav">
    <a class="btn ghost" href="11-sewing.html">← 單元 11</a>
    <a class="btn ghost" href="13-brief-cost.html">單元 13 →</a>
  </div>
</div>
<script>
const parts={
  hair:'<strong>頭髮／頭飾<\/strong>：植髮密度、膠粘、拉力。細件（髮夾）過安規；唔好擋 IR／開關。',
  dress:'<strong>衫／裙<\/strong>：樣版要跟身體＋關節行程。太貼＝舉手撕縫；太鬆＝露骨架。面料伸縮同色牢度。',
  shoes:'<strong>鞋<\/strong>：易脫穿、防丟（腳踝帶）。物料硬度防刮花腿部。',
  fast:'<strong>紐扣／魔術貼／拉鍊<\/strong>：細件安全（扭力拉力）、咬合壽命、兒童年齡分級。',
  sleeve:'<strong>袖<\/strong>：臂關節活動空間；電子手掌開關要按得到——袖口唔好太緊。',
};
document.querySelectorAll('.cpart').forEach(p=>{
  p.addEventListener('click',()=>{
    document.querySelectorAll('.cpart').forEach(x=>x.classList.remove('on'));
    p.classList.add('on');
    document.getElementById('dollPanel').innerHTML=parts[p.dataset.id];
  });
});
const pats=[
  {t:'净尺寸',d:'跟身體模型＋服装鬆量。電子凸位（電池倉）要加鬆。'},
  {t:'脫穿',d:'目標用戶（細路／收藏家）決定開口位置。'},
  {t:'面料',d:'透氣、起毛、印花對位、縮水率。'},
  {t:'工藝單',d:'車縫順序、熨燙、包裝摺法。'},
];
const patEl=document.getElementById('pats');
pats.forEach(p=>{
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<h3>${p.t}<\/h3><p>撳睇<\/p>`;
  c.onclick=()=>{ document.querySelectorAll('.pat-grid .card').forEach(x=>x.classList.remove('active')); c.classList.add('active');
    document.getElementById('patPanel').innerHTML=`<strong>${p.t}<\/strong>：${p.d}`; };
  patEl.appendChild(c);
});
const ho=[
  {t:'開關可達',d:'着衫後仲撳到手掌／肚開關？'},
  {t:'聲腔',d:'厚裙會唔會封住出聲孔？'},
  {t:'行程',d:'裙擺卡唔卡腿部機構？'},
  {t:'洗護',d:'可唔可脫衫洗？電子防水等級？標示要清楚。'},
];
ho.forEach((a,i)=>{
  const el=document.createElement('div'); el.className='step';
  el.innerHTML=`<div class="num">${i+1}<\/div><div><h4>${a.t}<\/h4><div class="detail" style="display:block">${a.d}<\/div><\/div>`;
  document.getElementById('ho').appendChild(el);
});
const quizItems=[
  {q:'樣版含關節行程同電子凸位鬆量', ok:true},
  {q:'紐扣等細件安規測試', ok:true},
  {q:'投資人愛好咖啡濃度', ok:false},
  {q:'着衫後開關／出聲仍可用', ok:true},
  {q:'辦公室牆漆色號', ok:false},
];
const quiz=document.getElementById('quiz');
quizItems.forEach((item,i)=>{
  const lab=document.createElement('label');
  lab.innerHTML=`<input type="checkbox" id="q${i}"> <span>${item.q}<\/span>`;
  quiz.appendChild(lab);
  lab.querySelector('input').addEventListener('change',score);
});
function score(){
  let m=0; quizItems.forEach((it,i)=>{if(document.getElementById('q'+i).checked===it.ok)m++;});
  const pct=Math.round(m/quizItems.length*100);
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('scoreNote').textContent='吻合度 '+pct+'%（應勾：樣版鬆量、細件安規、着衫後功能）';
}
score();
document.getElementById('markDone').onclick=()=>{
  const done=JSON.parse(localStorage.getItem('toyCourseDone')||'{}');
  done['12']=true; localStorage.setItem('toyCourseDone',JSON.stringify(done));
  document.getElementById('saveMsg').textContent='已儲存：單元 12 完成。';
};


(function(){
  // existing page may already bind .cpart — ensure hero groups work with dollPanel
  const map={
    dress:'衫／裙要跟關節行程；太貼會撕縫。',
    sleeve:'袖筒淨空要容納舉手；唔好露骨架。',
    fast:'扣件過細件安規；唔好擋開關。',
    shoes:'易脫穿同防丟；硬料防刮腿。',
    hair:'頭飾拉力同膠粘；唔擋 IR。'
  };
  document.querySelectorAll('svg .cpart').forEach(el=>{
    el.addEventListener('click',()=>{
      document.querySelectorAll('svg .cpart').forEach(x=>x.classList.remove('on'));
      el.classList.add('on');
      const id=el.getAttribute('data-id');
      const p=document.getElementById('dollPanel');
      if(p && map[id]) p.innerHTML='<strong>'+id+'<\/strong>：'+map[id];
    });
  });
})();

</script>
</body>
</html>
