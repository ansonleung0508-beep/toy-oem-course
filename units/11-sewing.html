<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>單元 11 · 車縫工藝</title>
<link rel="stylesheet" href="../assets/course.css" />
<style>
.pad.on rect, .pad.on circle { fill: rgba(255,209,102,.45) !important; }
.hit.on { outline: 2px solid var(--accent); }

.sew { width:min(100%,500px); margin:0 auto; }
.sew svg { width:100%; height:auto; }
.stitch { stroke-dasharray:6 4; animation: stitchMove 1s linear infinite; }
@keyframes stitchMove { to { stroke-dashoffset:-20; } }
.spart { cursor:pointer; }
.spart:hover, .spart.on { filter:brightness(1.25); }
.aql { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
.aql .card { cursor:pointer; }
.aql .card.active { border-color:var(--soft); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topnav">
    <a class="btn ghost" href="../index.html">← 課程目錄</a>
    <span class="badge">單元 11 · 毛絨</span>
  </div>
  <h1>車縫工藝</h1>
  <p class="lead">車縫決定外觀 AQL、強度同能不能「藏得住」電子線。針距、縫型、打開方式要寫進 SOP。</p>

    <div class="hero-stage">
    <div class="stage3d">
      <h3 style="margin-top:0;">縫份同針法（切換針距）</h3>
      <p class="hero-caption">撳針法同拖縫份：睇車線同布邊距離——動作位要加固。</p>
      <div class="hero-widget">
        <svg viewBox="0 0 640 280" role="img" aria-label="車縫">
          <rect x="8" y="8" width="624" height="264" rx="16" fill="#121925"/>
          <rect x="80" y="60" width="400" height="140" rx="8" fill="#2a2030" stroke="#ff8fab"/>
          <line id="seamLine" x1="120" y1="60" x2="120" y2="200" stroke="#5b8cff" stroke-width="2" stroke-dasharray="6 4"/>
          <text id="seamLabel" x="120" y="230" text-anchor="middle" fill="#b9d0ff" font-size="12">縫份 8mm</text>
          <path id="stitchPath" d="" fill="none" stroke="#ffd166" stroke-width="2"/>
          <text id="stitchLabel" x="400" y="230" text-anchor="middle" fill="#ffe9b0" font-size="12">平車 · 針距 3mm</text>
        </svg>
        <div class="hero-controls">
          <label>縫份 mm <input type="range" id="seamAllow" min="4" max="15" value="8"></label>
          <button class="btn ghost" type="button" id="stitchType">切換針法</button>
        </div>
      </div>
      <div class="panel" id="sewPanel"><strong>車縫互動</strong>：縫份同針距要寫入工藝圖。</div>
    </div>
  </div>


  <h2>外觀 AQL 常見項（撳卡）</h2>
  <div class="aql" id="aql"></div>
  <div class="panel" id="aqlPanel">揀一項缺陷。</div>

  <h2>工藝 lock</h2>
  <div class="timeline" id="lock"></div>

  <div class="exercise">
    <h3>單元練習</h3>
    <p>電子毛絨車縫，邊啲<strong>必須</strong>寫入工藝？</p>
    <div class="checklist" id="quiz"></div>
    <div class="progress"><span id="bar"></span></div>
    <p class="note" id="scoreNote"></p>
    <button class="btn" type="button" id="markDone">完成本單元</button>
    <p class="note" id="saveMsg"></p>
  </div>

  <div class="footer-nav">
    <a class="btn ghost" href="10-plush-materials.html">← 單元 10</a>
    <a class="btn ghost" href="12-doll-clothes.html">單元 12 →</a>
  </div>
</div>
<script>
const parts={
  outline:'<strong>外輪廓縫<\/strong>：針距（例如 3–4mm）、線色、縫份。毛向要對齊，否則外觀花。',
  open:'<strong>翻口／裝配口<\/strong>：電子整機裝入後先封口。暗縫／拉鍊／魔術貼取捨：外觀 vs 維修。',
  reinf:'<strong>加固<\/strong>：腋下、頸、耳朵根。動作位雙車或加布條；同單元 09 干涉對應。',
  channel:'<strong>線通道<\/strong>：車縫前埋布筒或套管，避免車針刺線。位置同線位圖一致。',
  face:'<strong>五官<\/strong>：繡／塑膠眼／燙印。拉力測試、尖點安規；同頭骨固位。',
};
document.querySelectorAll('.spart').forEach(p=>{
  p.addEventListener('click',()=>{
    document.querySelectorAll('.spart').forEach(x=>x.classList.remove('on'));
    p.classList.add('on');
    document.getElementById('sewPanel').innerHTML=parts[p.dataset.id];
  });
});
const aqls=[
  {t:'跳針／斷線',d:'強度同外觀雙殺。查張力、針號、線質。'},
  {t:'毛向錯',d:'左右腳毛向相反好明顯。開料圖要標箭頭。'},
  {t:'露線頭',d:'AQL 常客。剪線同鎖結工藝。'},
  {t:'變形歪臉',d:'填充不均或車縫拉力不均。樣板封樣對照。'},
  {t:'對稱度',d:'耳眼高低。用工裝定位。'},
  {t:'髒污油漬',d:'產線管理；包裝前清潔標準。'},
];
const aqlEl=document.getElementById('aql');
aqls.forEach(a=>{
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<h3>${a.t}<\/h3><p>撳睇<\/p>`;
  c.onclick=()=>{ document.querySelectorAll('.aql .card').forEach(x=>x.classList.remove('active')); c.classList.add('active');
    document.getElementById('aqlPanel').innerHTML=`<strong>${a.t}<\/strong>：${a.d}`; };
  aqlEl.appendChild(c);
});
const lock=[
  {t:'縫型圖',d:'每條縫的縫型、針距、線色、加固。'},
  {t:'裝配順序',d:'先裝電子定先車——影響返修同刺線風險。'},
  {t:'工時',d:'產前樣鎖工時，報價同產能基線。'},
  {t:'AQL',d:'嚴重／主要／次要缺陷定義同抽樣水準。'},
];
lock.forEach((a,i)=>{
  const el=document.createElement('div'); el.className='step';
  el.innerHTML=`<div class="num">${i+1}<\/div><div><h4>${a.t}<\/h4><div class="detail" style="display:block">${a.d}<\/div><\/div>`;
  document.getElementById('lock').appendChild(el);
});
const quizItems=[
  {q:'縫型圖（針距／線色／加固）', ok:true},
  {q:'裝配口同線通道避位', ok:true},
  {q:'董事會茶歇甜品', ok:false},
  {q:'外觀 AQL 缺陷定義', ok:true},
  {q:'年會場地訂金收據', ok:false},
];
const quiz=document.getElementById('quiz');
quizItems.forEach((item,i)=>{
  const lab=document.createElement('label');
  lab.innerHTML=`<input type="checkbox" id="q${i}"> <span>${item.q}<\/span>`;
  quiz.appendChild(lab);
  lab.querySelector('input').addEventListener('change',score);
});
function score(){
  let m=0; quizItems.forEach((it,i)=>{if(document.getElementById('q'+i).checked===it.ok)m++;});
  const pct=Math.round(m/quizItems.length*100);
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('scoreNote').textContent='吻合度 '+pct+'%（應勾：縫型圖、裝配口線通道、AQL）';
}
score();
document.getElementById('markDone').onclick=()=>{
  const done=JSON.parse(localStorage.getItem('toyCourseDone')||'{}');
  done['11']=true; localStorage.setItem('toyCourseDone',JSON.stringify(done));
  document.getElementById('saveMsg').textContent='已儲存：單元 11 完成。';
};


(function(){
  const types=[{n:'平車',dash:'6 4'},{n:'雙針',dash:'3 3'},{n:'拷邊',dash:'1 2'}];
  let ti=0;
  const line=document.getElementById('seamLine');
  const lab=document.getElementById('seamLabel');
  const stitch=document.getElementById('stitchPath');
  const slab=document.getElementById('stitchLabel');
  const panel=document.getElementById('sewPanel');
  function render(){
    const a=+document.getElementById('seamAllow').value;
    const x=80+a*6;
    if(line){ line.setAttribute('x1',x); line.setAttribute('x2',x); }
    if(lab) lab.textContent=`縫份 ${a}mm`;
    const t=types[ti];
    if(stitch){ stitch.setAttribute('d',`M${x+10} 80 V180`); stitch.setAttribute('stroke-dasharray', t.dash); }
    if(slab) slab.textContent=`${t.n} · 針距示意`;
    if(panel) panel.innerHTML=`<strong>車縫<\/strong>：縫份 ${a}mm、${t.n}——動作位建議加固。`;
  }
  document.getElementById('seamAllow')?.addEventListener('input', render);
  document.getElementById('stitchType')?.addEventListener('click',()=>{ ti=(ti+1)%types.length; render(); });
  render();
})();

</script>
</body>
</html>
