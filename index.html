<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>電子機構軟綿玩具 OEM 課程</title>
<link rel="stylesheet" href="assets/course.css" />
</head>
<body>
<div class="wrap">
  <div class="topnav">
    <span class="badge">玩具工程師自學地圖</span>
    <span class="note">進度會存在本機瀏覽器</span>
  </div>
  <h1>電子機構軟綿玩具<br>OEM 開發課程</h1>
  <p class="lead">學習次序：<strong>電子 → 機械 → 毛絨／公仔衫 → 其他</strong>。有時間就嚟上，有立體層次同可點擊互動。</p>

  <div class="hero-stage">
    <div class="stage3d">
      <div class="layers">
        <button class="layer-btn on" data-layer="elec" type="button">電子層</button>
        <button class="layer-btn on" data-layer="mech" type="button">機構層</button>
        <button class="layer-btn on" data-layer="soft" type="button">軟綿層</button>
      </div>
      <div class="svg-wrap">
        <svg class="plush" viewBox="0 0 420 320" role="img" aria-label="互動軟綿玩具示意">
          <defs>
            <radialGradient id="fur" cx="50%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#ffc2d4"/>
              <stop offset="100%" stop-color="#e8799b"/>
            </radialGradient>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".35"/>
            </filter>
          </defs>
          <g id="layer-soft" filter="url(#softShadow)">
            <ellipse cx="210" cy="200" rx="110" ry="88" fill="url(#fur)"/>
            <circle cx="210" cy="110" r="62" fill="url(#fur)"/>
            <circle cx="185" cy="100" r="7" fill="#2b2430"/>
            <circle cx="235" cy="100" r="7" fill="#2b2430"/>
            <ellipse cx="210" cy="118" rx="10" ry="7" fill="#ff6b8a"/>
            <path d="M150 175 Q120 140 135 115" stroke="#e8799b" stroke-width="16" fill="none" stroke-linecap="round"/>
            <path d="M270 175 Q300 140 285 115" stroke="#e8799b" stroke-width="16" fill="none" stroke-linecap="round"/>
          </g>
          <g id="layer-mech" opacity="0.95">
            <rect x="175" y="165" width="70" height="48" rx="10" fill="#1f3d2d" stroke="#7ddea2" stroke-width="2"/>
            <circle cx="195" cy="189" r="10" fill="#7ddea2" class="glow"/>
            <circle cx="225" cy="189" r="10" fill="#4bbf7a"/>
            <path d="M210 140 L210 165" stroke="#7ddea2" stroke-width="4" stroke-linecap="round"/>
            <text x="210" y="230" text-anchor="middle" fill="#9fe9c0" font-size="11" font-family="sans-serif">齒輪箱</text>
          </g>
          <g id="layer-elec">
            <rect x="248" y="150" width="46" height="32" rx="6" fill="#3a2f12" stroke="#ffd166" stroke-width="2"/>
            <circle cx="160" cy="168" r="16" fill="#3a2f12" stroke="#ffd166" stroke-width="2"/>
            <circle cx="160" cy="168" r="6" fill="#ffd166" class="glow"/>
            <path d="M176 168 H195 M248 166 H225" stroke="#ffd166" stroke-width="2" stroke-dasharray="4 3"/>
            <text x="271" y="170" text-anchor="middle" fill="#ffe9b0" font-size="10" font-family="sans-serif">PCB</text>
            <text x="160" y="198" text-anchor="middle" fill="#ffe9b0" font-size="10" font-family="sans-serif">喇叭</text>
          </g>
        </svg>
      </div>
      <div class="panel" id="layerPanel"><strong>學習路徑</strong>：先電子（黃）→ 機械（綠）→ 軟綿／公仔衫（粉）→ 其他（Brief、安規、樣板、工廠）。</div>
    </div>
  </div>

  <h2 style="margin:8px 0 14px;">單元目錄（已按你指定次序）</h2>
  <div class="grid" id="unitGrid"></div>
  <p class="note" style="margin-top:20px;">單元 01 總覽已開放。下一優先做電子線（02 起）。想我而家開做單元 02，直接講。</p>
</div>
<script>
const units = [
  {id:'01', title:'OEM 全流程地圖', desc:'三條線並行、階段關口、交接點', href:'units/01-oem-map.html', ready:true, track:'總覽'},
  {id:'02', title:'PCB／PCBA 同玩具接口', desc:'板外形、接口、消耗電流', href:'units/02-pcb-interface.html', ready:true, track:'電子'},
  {id:'03', title:'電池倉同電源安全', desc:'倉蓋、極性、安規', href:'#', ready:false, track:'電子'},
  {id:'04', title:'喇叭同聲腔', desc:'聲壓、腔體、布料遮擋', href:'#', ready:false, track:'電子'},
  {id:'05', title:'開關／感測／IR', desc:'觸發、誤觸、可靠性', href:'#', ready:false, track:'電子'},
  {id:'06', title:'線束同焊接可靠性', desc:'應力釋放、刺線風險', href:'#', ready:false, track:'電子'},
  {id:'07', title:'機構骨架同關節', desc:'骨架、行程、固位', href:'#', ready:false, track:'機械'},
  {id:'08', title:'齒輪／凸輪／彈簧', desc:'傳動、噪音、壽命', href:'#', ready:false, track:'機械'},
  {id:'09', title:'動作行程同軟綿干涉', desc:'擺頭舉手唔扯爛縫', href:'#', ready:false, track:'機械'},
  {id:'10', title:'毛絨物料同填充', desc:'布料、填充、手感', href:'#', ready:false, track:'毛絨'},
  {id:'11', title:'車縫工藝', desc:'縫型、難度、外觀 AQL', href:'#', ready:false, track:'毛絨'},
  {id:'12', title:'公仔衫同服飾', desc:'樣版、車縫、面料', href:'#', ready:false, track:'毛絨'},
  {id:'13', title:'Brief 同成本結構', desc:'功能表、目標價、拆成本', href:'#', ready:false, track:'其他'},
  {id:'14', title:'安全法規入門', desc:'ASTM / EN71 / CPC', href:'#', ready:false, track:'其他'},
  {id:'15', title:'模具注塑同軟綿交接', desc:'硬膠件進毛絨', href:'#', ready:false, track:'其他'},
  {id:'16', title:'樣板階段', desc:'手辦→工程樣→產前', href:'#', ready:false, track:'其他'},
  {id:'17', title:'測試同失效分析', desc:'壽命、跌落、FMEA', href:'#', ready:false, track:'其他'},
  {id:'18', title:'BOM／SOP／工藝檔', desc:'文件同產線落地', href:'#', ready:false, track:'其他'},
  {id:'19', title:'工廠審核、報價、變更', desc:'產能、ECN、成本鎖', href:'#', ready:false, track:'其他'},
  {id:'20', title:'包裝、運輸同綜合專案', desc:'包材測試＋全流程模擬', href:'#', ready:false, track:'其他'},
];
const done = JSON.parse(localStorage.getItem('toyCourseDone')||'{}');
const grid = document.getElementById('unitGrid');
units.forEach(u => {
  const a = document.createElement(u.ready ? 'a' : 'div');
  if (u.ready) a.href = u.href;
  a.className = 'card' + (u.ready ? '' : ' locked');
  a.innerHTML = '<span class="pill '+(u.ready?'':'soon')+'">'+(u.ready?(done[u.id]?'已完成':'可開始'):'即將推出')+'</span>'+
    '<h3>單元 '+u.id+' · '+u.title+'</h3><p><strong style="color:#b9d0ff">'+u.track+'</strong> · '+u.desc+'</p>';
  grid.appendChild(a);
});
const tips = {
  soft: '<strong>軟綿層（第三學）</strong>：面料、填充、車縫、公仔衫、外觀手感。',
  mech: '<strong>機構層（第二學）</strong>：骨架、齒輪箱、凸輪、彈簧、關節行程。',
  elec: '<strong>電子層（第一學）</strong>：PCB、喇叭、開關、電池倉、線束。'
};
document.querySelectorAll('.layer-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    btn.classList.toggle('on');
    const layer = btn.dataset.layer;
    const g = document.getElementById('layer-' + layer);
    const on = btn.classList.contains('on');
    g.style.display = on ? 'block' : 'none';
    document.getElementById('layerPanel').innerHTML = tips[layer];
  });
});
</script>
</body>
</html>
